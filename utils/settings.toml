[default.logger_config]
LOG_LEVEL = "INFO"

[default.llm]
# "scripted" runs fully offline with a deterministic fake model (used by the tests).
# "litellm" calls a real provider; set the model ids below and the provider key in
# utils/.secrets.toml or as environment variable (OPENAI_API_KEY, ANTHROPIC_API_KEY,
# AWS_* for Bedrock, AZURE_* for Azure OpenAI, or a local Ollama).
PROVIDER = "scripted"
TEMPERATURE = 0.0

[default.llm.models]
INTENT = "openai/gpt-5-mini"
ANSWER_CHECK = "openai/gpt-5-mini"
DIALOG = "openai/gpt-5"
GATE_SUMMARY = "openai/gpt-5"

# USD per 1M tokens, used by agentic/usage.py
[default.llm.prices]
"scripted" = { input = 0.0, output = 0.0 }
"openai/gpt-5-mini" = { input = 0.25, output = 2.0 }
"openai/gpt-5" = { input = 1.25, output = 10.0 }

[default.agentic]
FREE_TEXT_CONFIDENCE_THRESHOLD = 0.7
RECURSION_LIMIT = 25
PLAYBOOK = "company_onboarding"

[default.data_platform]
DUCKDB_PATH = "data/energy.duckdb"
LOCAL_TIMEZONE = "Europe/Berlin"
SMARD_BASE_URL = "https://www.smard.de/app/chart_data"
SMARD_REGION = "DE"
SMARD_RESOLUTION = "hour"
# First incremental run without a watermark starts this many days back.
INCREMENTAL_BOOTSTRAP_DAYS = 14

[default.data_platform.smard_filters]
netzlast = 410
photovoltaik = 4068
wind_onshore = 4067
wind_offshore = 1225

[default.industrial_ml]
CMAPSS_BASE_URL = "https://huggingface.co/datasets/SoyVitou/NASA-C-MAPSS-Turbofan-Engine/resolve/main/data"
CACHE_DIR = "industrial_ml/.cache"
RANDOM_SEED = 42
